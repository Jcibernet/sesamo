<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{.Title}}</title>
  <link rel="stylesheet" href="{{.BaseURL}}/ui/theme.css">
  {{if .BrandCSS}}<link rel="stylesheet" href="{{.BaseURL}}/ui/brand.css">{{end}}
  {{if .ThemeCSSURL}}<link rel="stylesheet" href="{{.ThemeCSSURL}}">{{end}}
</head>
<body>
  <main class="sesamo-card">
    {{if .LogoURL}}<img class="sesamo-logo" src="{{.LogoURL}}" alt="">{{end}}
    <h1>{{.Title}}</h1>
    <p class="sesamo-note">{{.Body}}</p>
    <p class="sesamo-foot"><a href="{{.BaseURL}}/login">Volver</a></p>
  </main>
</body>
</html>
